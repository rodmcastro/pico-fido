name: Build RP2350 USB - FIDO2 LED GPIO 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Install Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout 2.1.1
          git submodule update --init

      - name: Force WS2812 LED on GPIO 16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pico-keys-sdk/src/led/led.c")
          text = path.read_text()
          needle = "void led_init(void) {\n"
          block = """void led_init(void) {
          #ifdef WAVESHARE_RP2350_ZERO
              phy_data.led_driver = PHY_LED_DRIVER_WS2812;
              phy_data.led_gpio = 16; // Pino oficial do LED WS2812
              phy_data.led_driver_present = true;
              phy_data.led_gpio_present = true;
              phy_data.led_order = PHY_LED_ORDER_GRB;
              phy_data.led_order_present = true;
              phy_data.led_brightness = MAX_BTNESS;
              phy_data.led_brightness_present = true;
              phy_data.opts &= ~PHY_OPT_DIMM;
          #endif
          """
          text = text.replace(needle, block, 1)
          path.write_text(text)
          PY

      - name: Build RP2350
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build
          cd build
          cmake .. -DPICO_BOARD=waveshare_rp2350_zero
          make -j$(nproc)

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico-fido-rp2350-led-gpio16
          path: build/pico_fido.uf2
