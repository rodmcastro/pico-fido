name: Build RP2350 USB - Brute Force LED Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Install Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout 2.1.1
          git submodule update --init

      - name: Brute Force All GPIOs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("pico-keys-sdk/src/main.c")
          text = path.read_text()

          # Adiciona a biblioteca padrão de GPIO se não existir
          if '#include "pico/stdlib.h"' not in text:
              text = text.replace('#include "pico/stdio.h"', '#include "pico/stdio.h"\n#include "pico/stdlib.h"')

          # Substitui a inicialização normal pelo pisca-pisca em todos os pinos
          new_block = """
              for(int i=0; i<=29; i++) {
                  gpio_init(i);
                  gpio_set_dir(i, GPIO_OUT);
              }
              while (true) {
                  for(int i=0; i<=29; i++) gpio_put(i, 1);
                  sleep_ms(500);
                  for(int i=0; i<=29; i++) gpio_put(i, 0);
                  sleep_ms(500);
              }"""
          
          text = re.sub(r'led_init\(\);\s*usb_init\(\);', new_block, text)
          path.write_text(text)
          PY

      - name: Build Generic Pico 2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build
          cd build
          cmake .. -DPICO_BOARD=pico2
          make -j$(nproc)

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico-fido-rp2350-brute-force
          path: build/pico_fido.uf2
