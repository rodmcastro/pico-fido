name: Build RP2350 Zero - LED Hardware Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Install Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk
          cd pico-sdk
          git checkout 2.1.1
          git submodule update --init

      - name: Patch firmware for direct WS2812 hardware test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pico-keys-sdk/src/main.c")
          text = path.read_text()

          # ---------------------------------------------------------
          # Ensure sleep_ms() is available.
          # ---------------------------------------------------------
          include_marker = '#include "pico/stdio.h"\n'
          include_replacement = (
              '#include "pico/stdio.h"\n'
              '#include "pico/time.h"\n'
          )

          if include_marker not in text:
              raise SystemExit(
                  "ERROR: pico/stdio.h include not found"
              )

          if '#include "pico/time.h"\n' not in text:
              text = text.replace(
                  include_marker,
                  include_replacement,
                  1
              )

          # ---------------------------------------------------------
          # Replace normal LED initialization with a direct
          # WS2812 hardware test.
          # ---------------------------------------------------------
          old_block = (
              '    led_init();\n'
              '\n'
              '    usb_init();\n'
          )

          new_block = (
              '    /* Direct WS2812 hardware test. */\n'
              '    extern led_driver_t led_driver_ws2812;\n'
              '\n'
              '    /* Force Waveshare RP2350 Zero onboard LED parameters. */\n'
              '    phy_data.led_gpio = 16;\n'
              '    phy_data.led_gpio_present = true;\n'
              '    phy_data.led_driver = PHY_LED_DRIVER_WS2812;\n'
              '    phy_data.led_driver_present = true;\n'
              '    phy_data.led_order = PHY_LED_ORDER_GRB;\n'
              '    phy_data.led_order_present = true;\n'
              '    phy_data.led_brightness = MAX_BTNESS;\n'
              '    phy_data.led_brightness_present = true;\n'
              '    phy_data.opts |= PHY_OPT_DIMM;\n'
              '\n'
              '    led_driver = &led_driver_ws2812;\n'
              '    led_driver->init();\n'
              '\n'
              '    while (true) {\n'
              '        led_driver->set_color(LED_COLOR_RED, MAX_BTNESS, 1.0f);\n'
              '        sleep_ms(1000);\n'
              '\n'
              '        led_driver->set_color(LED_COLOR_GREEN, MAX_BTNESS, 1.0f);\n'
              '        sleep_ms(1000);\n'
              '\n'
              '        led_driver->set_color(LED_COLOR_BLUE, MAX_BTNESS, 1.0f);\n'
              '        sleep_ms(1000);\n'
              '\n'
              '        led_driver->set_color(LED_COLOR_WHITE, MAX_BTNESS, 1.0f);\n'
              '        sleep_ms(1000);\n'
              '\n'
              '        led_driver->set_color(LED_COLOR_OFF, 0, 0.0f);\n'
              '        sleep_ms(500);\n'
              '    }\n'
              '\n'
              '    usb_init();\n'
          )

          if old_block not in text:
              raise SystemExit(
                  "ERROR: led_init()/usb_init() block not found"
              )

          text = text.replace(
              old_block,
              new_block,
              1
          )

          path.write_text(text)

          print("Direct WS2812 hardware-test firmware patch applied.")
          PY

      - name: Verify hardware-test patch
        run: |
          echo "=== Direct WS2812 configuration ==="
          grep -A18 -B3 "Direct WS2812 hardware test" \
            pico-keys-sdk/src/main.c

          echo "=== LED color sequence ==="
          grep -A22 "while (true)" \
            pico-keys-sdk/src/main.c

      - name: Build RP2350 Zero
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build
          cd build
          cmake .. -DPICO_BOARD=waveshare_rp2350_zero
          make -j$(nproc)

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico-fido-rp2350-zero-led-hardware-test
          path: build/pico_fido.uf2
